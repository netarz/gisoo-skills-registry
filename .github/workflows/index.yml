name: index

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'schema/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/build-index.mjs
      - name: Commit the index if it changed
        run: |
          if [ -n "$(git status --porcelain index.json index.min.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json index.min.json
            git commit -m "Rebuild index"
            git push
          else
            echo "Index is up to date."
          fi
