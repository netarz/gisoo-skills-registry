name: validate

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'schema/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills (offline: frontmatter, meta schema, limits, file types, secrets, safety scan)
        run: node scripts/validate.mjs
      - name: Index builds
        run: node scripts/build-index.mjs
